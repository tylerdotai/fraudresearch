name: Verify and deploy
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.3"
          python-version: "3.14"
      - name: PDF dependency on disposable CI runner only
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends poppler-utils
      - name: Install locked development environment
        run: uv sync --frozen --group dev
      - name: Code and deterministic contracts (no live dataset scans)
        run: |
          uv run ruff check .
          uv run mypy src
          uv run python tests/e2e.py
          uv run python tests/upgrade_e2e.py deterministic
          uv run python scripts/check_skills.py
          uv run python tests/release_e2e.py
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install locked website dependencies
        working-directory: site
        run: bun install --frozen-lockfile
      - name: Build production website
        working-directory: site
        run: bun run build
      - name: Browser dependencies on disposable CI runner only
        working-directory: site
        run: bunx playwright install --with-deps chromium
      - name: Production desktop, mobile and accessibility contracts
        working-directory: site
        env:
          FRAUDRESEARCH_SITE_PREVIEW: "1"
        run: bun run test:e2e
      - name: Upload only the static website, never test output
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/dist
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, website]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
