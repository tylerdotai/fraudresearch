[project]
name = "federal-fraud-workbench"
version = "0.1.0"
description = "Evidence-first public-record research for federal program integrity"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "duckdb>=1.4,<2",
    "httpx>=0.28,<1",
    "rapidfuzz>=3,<4",
]

[dependency-groups]
dev = ["ruff>=0.11,<1", "mypy>=1.15,<2"]

[project.scripts]
fraudlab = "fraudlab:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraudlab"]

[tool.ruff]
line-length = 110

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
